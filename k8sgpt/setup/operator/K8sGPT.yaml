apiVersion: core.k8sgpt.ai/v1alpha1
kind: K8sGPT
metadata:
  name: k8sgpt-sample
  namespace: k8sgpt-operator-system
spec:
  ai:
    enabled: true
    model: openai/gpt-5.4-mini
    backend: localai
    baseUrl: https://openrouter.ai/api/v1
    secret:
      name: k8sgpt-secret
      key: openrouter-api-key
    autoRemediation: 
      enabled: true
      similarityRequirement: "20"
      resources:
        - Pod
        - Service
        - Deployment
        - ConfigMap
    # backOff:
    #  enabled: false
    #  maxRetries: 5
    # anonymized: false
    # language: english
    # proxyEndpoint: https://10.255.30.150 # use proxyEndpoint to setup backend through an HTTP/HTTPS proxy
  noCache: false
  repository: ghcr.io/k8sgpt-ai/k8sgpt
  version: v0.4.33
  analysis:
    interval: 2m
  #integrations:
  # trivy:
  #  enabled: true
  #  namespace: trivy-system
  filters:
    - Log
  # sink:
  #   type: slack
  #   webhook: <webhook-url> # use the sink secret if you want to keep your webhook url private
  #   secret:
  #     name: slack-webhook
  #     key: url
  #extraOptions:
  #   backstage:
  #     enabled: true