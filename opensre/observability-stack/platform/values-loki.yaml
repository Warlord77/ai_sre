deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 168h
    allow_structured_metadata: true

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  persistence:
    enabled: true
    size: 2Gi

# Disable scalable components (we only run single binary on kind).
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# We don't need the bundled gateway — Grafana hits singleBinary directly.
gateway:
  enabled: false

# Disable chunks/results cache (memcached) — overkill for kind.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# We run promtail separately via its own chart.
test:
  enabled: false
lokiCanary:
  enabled: false

# Expose a ServiceMonitor so Prometheus scrapes loki's /metrics. Without this,
# our PlatformLokiDown alert has nothing to evaluate against and would fire
# spuriously via `absent()`.
monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: kps   # match the kube-prometheus-stack release selector
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
